<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Melody Plotter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Melody Plotter</h1>

    <div id="controls">
      <button id="btn-record" class="btn btn-record">&#9679; RECORD</button>
      <button id="btn-pause" class="btn btn-pause" disabled>&#10074;&#10074; PAUSE</button>
      <button id="btn-reset" class="btn btn-reset" disabled>&#8634; RESET</button>
    </div>

    <div id="status">Press RECORD and whistle or sing a note</div>

    <div id="labels-row">
      <div class="label-cell"><span class="label-note">C5</span><span class="label-freq">523 Hz</span></div>
      <div class="label-cell"><span class="label-note">C#</span><span class="label-freq">554 Hz</span></div>
      <div class="label-cell"><span class="label-note">D</span><span class="label-freq">587 Hz</span></div>
      <div class="label-cell"><span class="label-note">D#</span><span class="label-freq">622 Hz</span></div>
      <div class="label-cell"><span class="label-note">E</span><span class="label-freq">659 Hz</span></div>
      <div class="label-cell"><span class="label-note">F</span><span class="label-freq">698 Hz</span></div>
      <div class="label-cell"><span class="label-note">F#</span><span class="label-freq">740 Hz</span></div>
      <div class="label-cell"><span class="label-note">G</span><span class="label-freq">784 Hz</span></div>
      <div class="label-cell"><span class="label-note">G#</span><span class="label-freq">831 Hz</span></div>
      <div class="label-cell"><span class="label-note">A</span><span class="label-freq">880 Hz</span></div>
      <div class="label-cell"><span class="label-note">A#</span><span class="label-freq">932 Hz</span></div>
      <div class="label-cell"><span class="label-note">B</span><span class="label-freq">988 Hz</span></div>
      <div class="label-cell"><span class="label-note">C6</span><span class="label-freq">1047 Hz</span></div>
      <div class="label-cell"><span class="label-note">C#</span><span class="label-freq">1109 Hz</span></div>
      <div class="label-cell"><span class="label-note">D</span><span class="label-freq">1175 Hz</span></div>
      <div class="label-cell"><span class="label-note">D#</span><span class="label-freq">1245 Hz</span></div>
      <div class="label-cell"><span class="label-note">E</span><span class="label-freq">1319 Hz</span></div>
      <div class="label-cell"><span class="label-note">F</span><span class="label-freq">1397 Hz</span></div>
      <div class="label-cell"><span class="label-note">F#</span><span class="label-freq">1480 Hz</span></div>
      <div class="label-cell"><span class="label-note">G</span><span class="label-freq">1568 Hz</span></div>
      <div class="label-cell"><span class="label-note">G#</span><span class="label-freq">1661 Hz</span></div>
      <div class="label-cell"><span class="label-note">A</span><span class="label-freq">1760 Hz</span></div>
      <div class="label-cell"><span class="label-note">A#</span><span class="label-freq">1865 Hz</span></div>
      <div class="label-cell"><span class="label-note">B</span><span class="label-freq">1976 Hz</span></div>
      <div class="label-cell"><span class="label-note">C7</span><span class="label-freq">2093 Hz</span></div>
    </div>

    <div id="piano-roll-wrapper">
      <div id="piano-roll-inner">
        <div id="piano-keys">
          <div class="piano-key white octave-start"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key white octave-start"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key black"></div>
          <div class="piano-key white"></div>
          <div class="piano-key white octave-start"></div>
        </div>
        <canvas id="pitch-canvas"></canvas>
      </div>
    </div>

    <div id="scrollback-control">
      <label for="scrollback-slider">History:</label>
      <input type="range" id="scrollback-slider" min="0" max="100" value="100" step="1">
      <button id="btn-scroll-latest" class="btn-small">Latest</button>
    </div>
  </div>

  <script src="js/audio-processor.js"></script>
  <script src="js/piano-renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
